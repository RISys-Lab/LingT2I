[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingt2i"
version = "0.1.0"
description = "Generation and evaluation code for the LingT2I multilingual image-generation benchmark"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lingt2i*"]
